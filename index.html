<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Jiji</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Pacifico&display=swap" rel="stylesheet">
</head>
<body>

    <div class="card">
        <h1 class="neon-title">Happy Birthday Jiji</h1>
        <p class="subtitle">To the person who knows all my secrets and still loves me. ❤️</p>

        <!-- Large Live Shaking Giftbox -->
        <div class="gift-container">
            <div id="giftBox" class="gift-box" onclick="openGift()">🎁</div>
            <p class="click-hint">Tap the gift box for a surprise!</p>
        </div>
    </div>

    <!-- Background Song -->
    <audio id="bgMusic" src="song.mp3" preload="auto"></audio>

    <!-- Overlay Containers for Animations -->
    <div id="photoOverlay" class="photo-overlay"></div>
    <div id="flowerOverlay" class="flower-overlay"></div>

    <script src="script.js"></script>
</body>
</html>
